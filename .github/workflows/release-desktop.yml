name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_flags: "-tags webkit2_41 -platform linux/amd64"
          - os: windows-latest
            build_flags: "-platform windows/amd64"
          - os: macos-latest
            build_flags: "-platform darwin/universal"
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          check-latest: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies and build
        working-directory: ./desktop/frontend
        run: |
          npm ci || npm install
          npm run build

      - name: Build Wails Desktop App
        working-directory: ./desktop
        run: wails build ${{ matrix.build_flags }}

      - name: Package Release Assets
        shell: bash
        run: |
          mkdir -p release-assets
          ROOT_DIR=$(pwd)
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp desktop/build/bin/backtrack release-assets/backtrack-linux-amd64
            chmod +x release-assets/backtrack-linux-amd64
            tar -czf release-assets/backtrack-linux-amd64.tar.gz -C desktop/build/bin backtrack
          elif [ "${{ runner.os }}" = "Windows" ]; then
            cp desktop/build/bin/backtrack.exe release-assets/backtrack-windows-amd64.exe
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cd desktop/build/bin
            zip -r -q "$ROOT_DIR/release-assets/backtrack-macos-universal.zip" *.app
          fi

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

