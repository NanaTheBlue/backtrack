name: Release Desktop App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            build_flags: "-tags webkit2_41"
          - os: windows-latest
            platform: windows/amd64
            build_flags: ""
          - os: macos-latest
            platform: darwin/universal
            build_flags: ""
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          check-latest: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies and build
        working-directory: ./desktop/frontend
        run: |
          npm ci || npm install
          npm run build

      - name: Build Wails Desktop App
        working-directory: ./desktop
        run: wails build ${{ matrix.build_flags }}

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/build/bin/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

