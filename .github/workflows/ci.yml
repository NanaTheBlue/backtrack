name: CI

# Run this workflow on pushes to main, and on all pull requests
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  # Docker requires repository names to be strictly lowercase
  IMAGE_NAME: nanatheblue/backtrack

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    # 1. Check out the repository code
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Set up the Go environment
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.1'
        check-latest: true

    # 3. Download dependencies
    - name: Install dependencies
      run: go mod download

    # 4. Check formatting and suspicious code
    - name: Vet code
      run: go vet ./...

    # 5. Run tests with the race detector
    - name: Run tests
      run: go test -v -race ./...

    # 6. Verify the binaries compile
    - name: Build binaries
      run: |
        go build -o bin/server ./cmd/server

    # 7. Test the Docker build (runs only on pull requests)
    - name: Test Docker build
      if: github.event_name == 'pull_request'
      run: docker build -t backtrack-server:test .

  build-desktop:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27.1'
        check-latest: true

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24

    - name: Install Linux GUI dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev build-essential pkg-config

    - name: Install Wails CLI
      run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

    - name: Test and build frontend
      working-directory: ./desktop/frontend
      run: |
        npm ci || npm install
        npm run build

    - name: Build Wails Linux desktop binary
      working-directory: ./desktop
      run: wails build -tags webkit2_41

    - name: Upload desktop binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: backtrack-desktop-linux
        path: desktop/build/bin/

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-test, build-desktop]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
    # 1. Check out the repository code again for the new runner
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Log in to GHCR
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 3. Extract metadata (tags, labels) for Docker
    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

    # 4. Build and push Docker image
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    # 5. Deploy to EC2 via SSH
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Pull the latest image we just pushed
          sudo docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
          
          # Stop and remove the old container
          sudo docker stop backtrack-server || true
          sudo docker rm backtrack-server || true
          
          # Run the new container (adjust ports/env vars if needed)
          sudo docker run -d \
            --name backtrack-server \
            -p 9000:9000 \
            --restart unless-stopped \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main

